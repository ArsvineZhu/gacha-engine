[workspace]
resolver = "2"
members = [
    "crates/gacha-schema",
    "crates/gacha-core",
    "crates/gacha-pack",
    "crates/gacha-analysis",
    "crates/gacha-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
